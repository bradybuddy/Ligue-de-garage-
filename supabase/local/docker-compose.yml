# Pile Supabase minimale pour développer et tester en local (Postgres + Auth + courriels attrapés).
# Les secrets ci-dessous sont des valeurs de DÉVELOPPEMENT publiques. Ne jamais les utiliser en production.
name: buddy-beer-local
services:
  db:
    image: supabase/postgres:15.8.1.085
    environment:
      POSTGRES_PASSWORD: postgres-local
      JWT_SECRET: local-jwt-secret-au-moins-32-caracteres-xx
    ports: ["54322:5432"]
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      retries: 30
  auth:
    image: supabase/gotrue:v2.180.0
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres-local@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3123
      GOTRUE_URI_ALLOW_LIST: http://localhost:3123/**,http://localhost:3000/**
      GOTRUE_JWT_SECRET: local-jwt-secret-au-moins-32-caracteres-xx
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: auth@buddyandbeer.local
      GOTRUE_SMTP_SENDER_NAME: Buddy & Beer
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirme ton courriel — Buddy & Beer"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Ton nouveau mot de passe — Buddy & Beer"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway/templates/recovery.html
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["54324:8025"]
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth]
    ports: ["54321:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../templates:/usr/share/nginx/templates:ro
