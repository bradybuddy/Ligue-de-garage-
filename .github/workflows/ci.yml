# Contrôle de chaque changement. Sur Vercel, exiger ce contrôle avant la mise en production
# (Settings → Git → Deployment Checks / « Required checks »), sinon la promesse « 50 tests avant chaque mise en ligne » est fausse.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier (types, unités, base, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrôle d'avant mise en ligne (marque, fiche, bogues)
        # Les fonctions essentielles et les renseignements légaux peuvent manquer en développement : rapport seulement.
        run: npm run preflight || true
      - run: npm run typecheck
      - run: npm test

      - name: Supabase local (Postgres, Auth, Mailpit)
        run: |
          npm run db:up
          for i in $(seq 1 60); do curl -sf http://localhost:54321/auth/v1/health >/dev/null && break; sleep 2; done
      - name: Variables locales
        run: |
          node scripts/local-keys.mjs > .env.local
          {
            echo "APP_URL=http://localhost:3123"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "UNSUBSCRIBE_SECRET=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
          } >> .env.local
      - run: npm run db:migrate
      - name: Tests de la base (règles d'accès, file d'envoi)
        run: TEST_DATABASE_URL="$(grep ^DATABASE_URL= .env.local | cut -d= -f2-)" npm run test:db
      - run: npm run db:migrate

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npx playwright test --trace off
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultats
          path: e2e/.results
          retention-days: 7
